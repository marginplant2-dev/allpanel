# AllPanel — added alongside the existing marginplant sites. Nothing else is touched.
upstream allpanel_api {
    server 127.0.0.1:8010;
    keepalive 16;
}

# --- Player site: allpanel55.com ---
server {
    listen 80;
    listen [::]:80;
    server_name allpanel55.com www.allpanel55.com;

    root /var/www/sportx/user;
    index index.html;

    access_log /var/log/nginx/allpanel-user.access.log;
    error_log  /var/log/nginx/allpanel-user.error.log;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}

# --- Admin console: admin.allpanel55.com ---
server {
    listen 80;
    listen [::]:80;
    server_name admin.allpanel55.com;

    root /var/www/sportx/admin;
    index index.html;

    access_log /var/log/nginx/allpanel-admin.access.log;
    error_log  /var/log/nginx/allpanel-admin.error.log;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}

# --- API + WebSocket: api.allpanel55.com ---
server {
    listen 80;
    listen [::]:80;
    server_name api.allpanel55.com;

    access_log /var/log/nginx/allpanel-api.access.log;
    error_log  /var/log/nginx/allpanel-api.error.log;

    client_max_body_size 2m;

    location /ws {
        proxy_pass http://allpanel_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://allpanel_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
